; PlatformIO Project Configuration - Robot Arms
; Servo control firmware for robot arm
; Reference: ARD_ARMS/

[env:arms]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
monitor_eol = LF
monitor_echo = yes
monitor_filters = send_on_enter, colorize
upload_port = COM5
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library@^3.0.0
    Wire
