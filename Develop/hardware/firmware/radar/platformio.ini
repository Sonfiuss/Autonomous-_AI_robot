; PlatformIO Project Configuration - Radar / Ultrasonic Sensor
; HC-SR04 + PCA9685 Servo for radar sweep visualization

[env:radar]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
monitor_eol = LF
monitor_filters = time, colorize
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library@^3.0.0
    Wire
