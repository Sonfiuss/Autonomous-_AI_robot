; PlatformIO Project Configuration - ESP32 Audio Record & Playback
; Speaker : MAX98357A  I2S DAC  DIN=25  BCLK=27  LRC=26
; Mic     : INMP441   I2S MIC  SD=34   SCK=33   WS=32   L/R=GND

[env:esp32doit-devkit-v1]
platform  = espressif32
board     = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
build_src_filter = +<main.cpp>

; ── Debug env: only speaker, no mic, no PSRAM ─────────────────
[env:debug_speaker]
platform  = espressif32
board     = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_flags = -DDEBUG_SPEAKER_ONLY
board_build.flash_mode = dio
build_src_filter = +<debug_speaker.cpp> -<main.cpp>
