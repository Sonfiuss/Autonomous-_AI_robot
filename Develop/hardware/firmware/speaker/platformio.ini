; PlatformIO Project Configuration - ESP32 Audio Record & Playback
; Speaker : MAX98357A  I2S TX (I2S_NUM_1)  DIN=22  BCLK=19  LRC=18
; Mic     : INMP441   I2S RX (I2S_NUM_0)  SD=34   SCK=33   WS=32   L/R=GND

[common]
build_flags =
    -I include       ; expose include/ to all libs and src

[env:esp32doit-devkit-v1]
platform  = espressif32
board     = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
board_build.flash_mode  = dio
build_flags             = ${common.build_flags}
build_src_filter = +<main.cpp>

; ── Debug env: only speaker, no mic, no PSRAM ─────────────────
[env:debug_speaker]
platform  = espressif32
board     = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
build_flags =
    ${common.build_flags}
    -DDEBUG_SPEAKER_ONLY
build_src_filter = +<debug_speaker.cpp> -<main.cpp>
