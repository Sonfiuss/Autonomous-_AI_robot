<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-label="Sơ đồ chân nối STM32F103C8 tới 3 DM542, kèm trở và transistor">
  <style>
    .title { font:18px Arial, sans-serif; font-weight:700; }
    .box { fill:#fff; stroke:#222; stroke-width:1.5; rx:8 }
    .small { font:12px Arial, sans-serif; fill:#111 }
    .pin { font:13px "Courier New", monospace; fill:#111 }
    .rail { font:13px Arial, sans-serif; fill:#111 }
    .wire { stroke:#111; stroke-width:2; fill:none }
    .res { stroke:#000; stroke-width:2; fill:none }
    .trans { stroke:#111; stroke-width:1.2; fill:#fff }
    .note { font:12px Arial, sans-serif; fill:#1a3a5a }
    .gnd { stroke:#111; stroke-width:2 }
    .label-box { fill:#f7fbff; stroke:#cfe0ff; rx:6 }
    .pull { fill:#fff9e6; stroke:#f0d28a; rx:4 }
  </style>

  <text x="18" y="28" class="title">Sơ đồ chân & đấu trở: STM32F103C8 ↔ 3× DM542 (VMOT = 21V)</text>

  <!-- STM32 block -->
  <rect x="18" y="50" width="240" height="260" class="box"/>
  <text x="32" y="78" class="small">STM32F103C8 (3.3V)</text>
  <text x="32" y="100" class="pin">VDD 3.3V</text>
  <text x="32" y="118" class="pin">GND</text>

  <!-- GPIO pins -->
  <text x="32" y="140" class="pin">PA0 — STEP1 (to Rbase)</text>
  <text x="32" y="160" class="pin">PA1 — DIR1  (to Rbase)</text>
  <text x="32" y="180" class="pin">PA2 — STEP2 (to Rbase)</text>
  <text x="32" y="200" class="pin">PA3 — DIR2  (to Rbase)</text>
  <text x="32" y="220" class="pin">PA4 — STEP3 (to Rbase)</text>
  <text x="32" y="240" class="pin">PA5 — DIR3  (to Rbase)</text>

  <!-- 5V rail box -->
  <rect x="18" y="330" width="240" height="36" class="pull"/>
  <text x="32" y="352" class="rail">+5V (nguồn logic, riêng)</text>

  <!-- VMOT box -->
  <rect x="18" y="380" width="240" height="56" class="label-box"/>
  <text x="32" y="402" class="rail">+21V (VMOT) → cấp cho DM542 V+</text>
  <text x="32" y="420" class="rail">GND (chung): nối với GND STM32 và 5V GND</text>

  <!-- Drivers -->
  <g transform="translate(300,48)">
    <!-- Driver 1 -->
    <rect x="0" y="0" width="260" height="120" class="box"/>
    <text x="12" y="18" class="small">DM542 — Driver #1</text>
    <text x="12" y="36" class="pin">V+ (VMOT) → +21V</text>
    <text x="12" y="54" class="pin">GND → GND chung</text>

    <rect x="12" y="70" width="110" height="40" rx="4" fill="#eef8ff" stroke="#3a6fb0"/>
    <text x="18" y="92" class="pin">PUL+  PUL-</text>
    <text x="18" y="108" class="pin">DIR+  DIR-</text>
  </g>

  <g transform="translate(300,190)">
    <!-- Driver 2 -->
    <rect x="0" y="0" width="260" height="120" class="box"/>
    <text x="12" y="18" class="small">DM542 — Driver #2</text>
    <rect x="12" y="70" width="110" height="40" rx="4" fill="#eef8ff" stroke="#3a6fb0"/>
    <text x="18" y="92" class="pin">PUL+  PUL-</text>
    <text x="18" y="108" class="pin">DIR+  DIR-</text>
  </g>

  <g transform="translate(300,332)">
    <!-- Driver 3 -->
    <rect x="0" y="0" width="260" height="120" class="box"/>
    <text x="12" y="18" class="small">DM542 — Driver #3</text>
    <rect x="12" y="70" width="110" height="40" rx="4" fill="#eef8ff" stroke="#3a6fb0"/>
    <text x="18" y="92" class="pin">PUL+  PUL-</text>
    <text x="18" y="108" class="pin">DIR+  DIR-</text>
  </g>

  <!-- Pull-up resistors: show one column with labels and connect to each PUL+ -->
  <g transform="translate(240,330)">
    <text x="-18" y="-8" class="small">Pull-up resistors (4.7kΩ)</text>
    <path d="M0 8 L40 8" class="wire"/>
    <!-- resistor symbol -->
    <path d="M40 8 L56 8 L56 0 L72 16 L88 0 L104 16 L120 0 L120 8" class="res"/>
    <text x="126" y="12" class="small">4.7kΩ</text>
    <!-- wires to PUL+ of each driver -->
    <path d="M140 12 L300 110" class="wire"/> <!-- to driver1 PUL+ -->
    <path d="M140 12 L300 252" class="wire"/> <!-- to driver2 PUL+ -->
    <path d="M140 12 L300 394" class="wire"/> <!-- to driver3 PUL+ -->
    <text x="-18" y="26" class="small">+5V →</text>
  </g>

  <!-- Transistor symbols and connections for PUL- (show one repeated style for each driver) -->
  <!-- Transistor 1 -->
  <g transform="translate(140,90)">
    <text x="-8" y="-8" class="small">Q1 (2N2222)</text>
    <!-- transistor rectangle -->
    <rect x="0" y="0" width="34" height="34" rx="4" class="trans"/>
    <!-- emitter line down to GND -->
    <line x1="17" y1="34" x2="17" y2="80" class="wire"/>
    <text x="22" y="94" class="small">Emitter → GND</text>
    <!-- collector to driver PUL- -->
    <line x1="34" y1="17" x2="300" y2="110" class="wire"/>
    <text x="308" y="108" class="pin">→ PUL- (Driver1)</text>
    <!-- base to STM32 PA0 via Rbase -->
    <line x1="0" y1="17" x2="-140" y2="17" class="wire"/>
    <text x="-138" y="12" class="small">PA0</text>
    <!-- base resistor symbol -->
    <path d="M-120 17 L-104 17 L-104 9 L-88 25 L-72 9 L-56 25 L-40 9 L-40 17" class="res"/>
    <text x="-82" y="8" class="small">Rbase 4.7kΩ</text>
  </g>

  <!-- Transistor 2 -->
  <g transform="translate(140,232)">
    <text x="-8" y="-8" class="small">Q2 (2N2222)</text>
    <rect x="0" y="0" width="34" height="34" rx="4" class="trans"/>
    <line x1="17" y1="34" x2="17" y2="118" class="wire"/>
    <text x="22" y="132" class="small">Emitter → GND</text>
    <line x1="34" y1="17" x2="300" y2="252" class="wire"/>
    <text x="308" y="250" class="pin">→ PUL- (Driver2)</text>
    <line x1="0" y1="17" x2="-140" y2="17" class="wire"/>
    <text x="-138" y="12" class="small">PA2</text>
    <path d="M-120 17 L-104 17 L-104 9 L-88 25 L-72 9 L-56 25 L-40 9 L-40 17" class="res"/>
    <text x="-82" y="8" class="small">Rbase 4.7kΩ</text>
  </g>

  <!-- Transistor 3 -->
  <g transform="translate(140,374)">
    <text x="-8" y="-8" class="small">Q3 (2N2222)</text>
    <rect x="0" y="0" width="34" height="34" rx="4" class="trans"/>
    <line x1="17" y1="34" x2="17" y2="148" class="wire"/>
    <text x="22" y="162" class="small">Emitter → GND</text>
    <line x1="34" y1="17" x2="300" y2="394" class="wire"/>
    <text x="308" y="392" class="pin">→ PUL- (Driver3)</text>
    <line x1="0" y1="17" x2="-140" y2="17" class="wire"/>
    <text x="-138" y="12" class="small">PA4</text>
    <path d="M-120 17 L-104 17 L-104 9 L-88 25 L-72 9 L-56 25 L-40 9 L-40 17" class="res"/>
    <text x="-82" y="8" class="small">Rbase 4.7kΩ</text>
  </g>

  <!-- DIR transistors (show 1 example for clarity) -->
  <g transform="translate(520,80)">
    <text x="-8" y="-8" class="small">DIR example (per driver)</text>
    <!-- transistor -->
    <rect x="0" y="0" width="34" height="34" rx="4" class="trans"/>
    <line x1="17" y1="34" x2="17" y2="80" class="wire"/>
    <text x="22" y="94" class="small">Emitter → GND</text>
    <line x1="34" y1="17" x2="564" y2="110" class="wire"/>
    <text x="572" y="108" class="pin">→ DIR- (Driver1)</text>
    <line x1="0" y1="17" x2="-80" y2="17" class="wire"/>
    <text x="-140" y="20" class="small">PA1 → Rbase 4.7kΩ</text>
  </g>

  <!-- GND common -->
  <line x1="60" y1="520" x2="760" y2="520" class="gnd"/>
  <text x="770" y="524" class="small">GND chung (STM32, 5V, VMOT/DM542)</text>

  <!-- Notes -->
  <rect x="24" y="560" width="940" height="140" rx="8" fill="#fffefa" stroke="#e6e6c8"/>
  <text x="40" y="584" class="note">Ghi chú ngắn:</text>
  <text x="40" y="602" class="note">- Pull-up: +5V → qua R = 4.7kΩ → PUL+, DIR+, ENA+ (mỗi driver).</text>
  <text x="40" y="620" class="note">- STM32 GPIO → Rbase 4.7kΩ → base transistor NPN (2N2222). Transistor collector → PUL-/DIR-/ENA-. Emitter → GND.</text>
  <text x="40" y="638" class="note">- Nối chung GND (rất quan trọng). Không nối 5V thẳng vào GPIO push-pull.</text>
  <text x="40" y="656" class="note">- Xung STEP: giữ ≥ 10 µs; thử nghiệm bắt đầu với 1 ms để dễ quan sát.</text>
</svg>